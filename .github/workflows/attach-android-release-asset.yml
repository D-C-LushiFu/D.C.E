name: Attach Android Release Asset

on:
  push:
    tags:
      - 'VBeta1.1-attach-android'

permissions:
  actions: read
  contents: write

jobs:
  attach-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download compiled Android artifact
        uses: actions/download-artifact@v4
        with:
          name: androidBuild
          path: artifacts/
          run-id: 42493102795
          github-token: ${{ github.token }}

      - name: Attach Android package to Beta1.1
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: VBeta1.1
          name: VBeta1.1
          files: artifacts/**/*.zip
          overwrite_files: true
