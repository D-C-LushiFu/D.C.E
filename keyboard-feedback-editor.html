<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>键盘反馈设置 · 原型</title>
<style>
  :root{
    --panel: rgba(9,12,18,.28); --panel2: rgba(14,18,26,.30);
    --card: rgba(255,255,255,.05); --card-hi: rgba(120,170,255,.16);
    --line: rgba(255,255,255,.09); --line-hi: rgba(140,180,255,.55);
    --ink:#EEF3FA; --ink2:#A9B3C4; --ink3:#7C8697;
    --accent:#79A9FF; --arrow:#FFD24A; --ok:#7BE08A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* 兜底：任何漏了容器的裸 button 也不至于退回浏览器默认外观 */
  button{font-family:inherit;font-size:12.5px;border-radius:6px;border:1px solid var(--line);
    background:rgba(255,255,255,.04);color:var(--ink2);cursor:pointer}
  body{height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(1200px 600px at 20% 0%,#1b2740 0,transparent 60%),
               linear-gradient(160deg,#2a3550,#131a28 55%,#0c1119)}
  #stage{width:1280px;height:720px;display:grid;grid-template-columns:60% 40%;grid-template-rows:1fr 64px;transform-origin:center}

  /* ---------- 左 60% ---------- */
  #left{grid-area:1/1;background:var(--panel);backdrop-filter:blur(6px);border-right:1px solid var(--line);
    padding:16px 24px 8px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
  .head h1{font-size:21px;font-weight:650}
  .head .sub{font-size:12px;color:var(--ink3);margin-top:2px}
  .lbl{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);
    display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .lbl::after{content:"";flex:1;height:1px;background:var(--line)}
  .box{background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:8px;padding:12px 14px}

  .keys{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
  .key{aspect-ratio:1/1;border-radius:7px;position:relative;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:600;cursor:default;transition:transform .08s}
  .key.pick{cursor:pointer} .key.pick:hover{transform:translateY(-2px)}
  .key .arw{position:absolute;top:-15px;left:50%;transform:translateX(-50%);width:0;height:0;
    border-left:8px solid transparent;border-right:8px solid transparent;border-top:10px solid var(--arrow);display:none}
  .key.sel .arw{display:block} .key.sel{outline:2px solid var(--arrow);outline-offset:1px}
  /* 统计块用 flex 而不是 grid：宽度是由设置项（百分比）控制的，
     grid 的 1fr 会把 width% 压掉，看起来就是"调宽度没反应" */
  #statsC,#statsD{margin-top:6px;justify-self:center;display:flex;gap:6px}
  .stat{border-radius:7px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;cursor:default;flex:none}
  .stat.pick{cursor:pointer} .stat.sel{outline:2px solid var(--arrow);outline-offset:1px}
  .stat .num{font-weight:700;font-size:14px}

  .tri{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .tri .cell{display:flex;flex-direction:column;align-items:center;gap:8px}
  .tri .cap{font-size:11px;color:var(--ink3)}
  .tri .demo{width:58px;height:58px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:700}
  .tri .barwrap{height:70px;display:flex;align-items:flex-end}
  .tri .bar{width:26px;border-radius:4px 4px 0 0}
  #triBlock{display:none}

  /* ---------- 右 40% ---------- */
  #right{grid-area:1/2;background:var(--panel2);backdrop-filter:blur(6px);padding:16px 20px 8px;
    display:flex;flex-direction:column;gap:14px;overflow:hidden}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .tab{height:34px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink2);
    font-size:13px;cursor:pointer}
  .tab:hover{background:rgba(255,255,255,.08);color:#fff}
  .tab.on{background:var(--card-hi);border-color:var(--line-hi);color:#fff;font-weight:600}

  .list{flex:1;overflow-y:auto;padding-right:4px}
  .list::-webkit-scrollbar{width:6px}
  .list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}
  .grp{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#6FA8DC;margin:16px 0 6px}
  .grp:first-child{margin-top:0}

  .row{display:flex;align-items:center;gap:10px;min-height:34px;padding:0 10px;border-radius:6px;
    border:1px solid transparent}
  .row:hover{background:rgba(255,255,255,.04)}
  .row.sel{background:var(--card-hi);border-color:var(--line-hi)}
  .row.sel .nm{color:#fff}
  .row .nm{flex:none;width:112px;font-size:13px;color:var(--ink2)}
  .row .ctl{flex:1;display:flex;align-items:center;gap:8px;justify-content:flex-end}
  .row .rl{width:22px;text-align:center;color:var(--ink3);font-size:14px;cursor:pointer;flex:none}
  .row .rl:hover{color:var(--arrow)}
  .row.off{opacity:.36}

  .sw{width:18px;height:18px;border-radius:5px;border:1px solid rgba(255,255,255,.25);flex:none}
  .hv{font-size:12.5px;font-variant-numeric:tabular-nums}
  .switch{width:38px;height:20px;border-radius:10px;background:rgba(255,255,255,.12);position:relative;
    cursor:pointer;flex:none;transition:background .12s}
  .switch i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#8b93a6;transition:.12s}
  .switch.on{background:rgba(123,224,138,.28)} .switch.on i{left:20px;background:var(--ok)}
  .slider{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.16);outline:none}
  .slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer}
  .seg{display:flex;gap:6px}
  .seg button{padding:4px 9px;font-size:11.5px;border-radius:5px;border:1px solid var(--line);
    background:rgba(255,255,255,.04);color:var(--ink3);cursor:pointer;font-family:inherit}
  .seg button.on{background:var(--card-hi);border-color:var(--line-hi);color:#fff}

  /* 取色工具（仅颜色类设置项） */
  #tools{border-top:1px solid var(--line);padding-top:12px;display:none}
  #tools.show{display:block}
  .thead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .thead .t{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
  .thead .cur{width:24px;height:24px;border-radius:6px;border:1px solid rgba(255,255,255,.25)}
  .hexin{width:88px;height:26px;border-radius:6px;border:1px solid var(--line);background:rgba(0,0,0,.35);
    color:var(--ink);font-family:inherit;font-size:12.5px;padding:0 8px;letter-spacing:.06em}
  .hexin:focus{outline:none;border-color:var(--line-hi)}
  .tbody{display:flex;gap:12px;align-items:flex-start}
  .wheel{width:112px;height:112px;border-radius:50%;position:relative;flex:none;cursor:crosshair;
    background:conic-gradient(from -90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);border:1px solid rgba(255,255,255,.18)}
  .wheel::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,255,255,0) 72%)}
  .dot{position:absolute;width:12px;height:12px;border-radius:50%;border:2px solid #fff;
    box-shadow:0 0 0 1px rgba(0,0,0,.7);transform:translate(-50%,-50%);pointer-events:none}
  .bri{width:14px;height:112px;border-radius:4px;flex:none;cursor:crosshair;position:relative;
    background:linear-gradient(180deg,#fff,#000);border:1px solid rgba(255,255,255,.18)}
  .bri .dot{left:-3px;right:-3px;width:auto;height:3px;border-radius:2px;transform:none;background:#fff;border:none;box-shadow:none}
  .pal{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;flex:1}
  .pal i{aspect-ratio:1/1;border-radius:4px;cursor:pointer;border:1px solid rgba(255,255,255,.14)}
  .pal i:hover{transform:scale(1.12)}

  /* ---------- 底部居中 ---------- */
  #foot{grid-area:2/1/3/3;background:rgba(8,10,15,.30);backdrop-filter:blur(6px);border-top:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;gap:16px}
  .btn{height:36px;min-width:150px;border-radius:8px;border:1px solid var(--line);cursor:pointer;
    font-size:13.5px;font-weight:600;font-family:inherit}
  .btn.primary{background:rgba(120,170,255,.20);border-color:var(--line-hi);color:#fff}
  .btn.primary:hover{background:rgba(120,170,255,.30)}
  .btn.ghost{background:rgba(255,255,255,.05);color:var(--ink2)}
  .btn.ghost:hover{background:rgba(255,255,255,.10);color:#fff}
</style>
</head>
<body>
<div id="stage">
  <div id="left">
    <div class="head">
      <h1>键盘反馈设置</h1>
      <div class="sub">上排＝默认样式（只读）· 下排＝自定样式，点击按键可单独调整 · 箭头指着当前编辑目标</div>
    </div>
    <div><div class="lbl">默认样式</div>
      <div class="box"><div class="keys" id="keysD"></div><div id="statsD"></div></div></div>
    <div><div class="lbl">自定样式</div>
      <div class="box"><div class="keys" id="keysC"></div><div id="statsC"></div></div></div>
    <div id="triBlock" style="flex:1;min-height:0">
      <div class="lbl">当前编辑目标的三种样式</div>
      <div class="box tri" id="tri"></div>
    </div>
  </div>

  <div id="right">
    <div class="tabs" id="tabs"></div>
    <div class="list" id="list"></div>
    <div id="tools">
      <div class="thead">
        <span class="t">取色</span>
        <span class="cur" id="curSw"></span>
        <input class="hexin" id="hexIn" maxlength="7" spellcheck="false">
        <span style="flex:1"></span>
        <span class="t" id="targetName"></span>
      </div>
      <div class="tbody">
        <div class="wheel" id="wheel"><span class="dot" id="wheelDot"></span></div>
        <div class="bri" id="bri"><span class="dot" id="briDot" style="top:0"></span></div>
        <div class="pal" id="pal"></div>
      </div>
    </div>
  </div>

  <div id="foot">
    <button class="btn ghost" id="btnReset">恢复默认设置</button>
    <button class="btn primary" id="btnSave">保存并退出</button>
  </div>
</div>

<script>
/* ================= 模型 ================= */
const KEYS = 10, LETTER = ['A','S','D','F','V','N','J','K','L',';'];
const ids = () => [...Array(KEYS).keys()].map(i=>'k'+i).concat(['kps','total']);
const labelOf = t => t.startsWith('k') ? LETTER[+t.slice(1)] : t.toUpperCase();

/* 「透明度」＝ 游戏里的 keyboardAlpha（默认 0.8）。
   它是一层系数：填充 = 0.3×透明度，描边 = 0.8×透明度。 */
const DEF = () => ({
  alpha:0.80, normalColor:'#FFFFFF', normalText:'#0A0A0A',
  pressColor:'#FFFFFF', pressText:'#0A0A0A',
  barColor:'#FFFFFF', barMode:'custom', barAlpha:1, barOn:true,
  barMax:70, barSpeed:1, barStay:500, barFade:'fade', barDis:true,
  /* 统计区（每个目标一份，KPS / Total 可各自不同） */
  statHeight:34, statWidth:100, statAlpha:0.8
});
const store = {}; ids().forEach(id => store[id] = DEF());
let ui = { tab:'color', selTarget:'k3', selKey:3, selRow:'normalColor', theme:'default' };

const THEMES = {
  default:  { normalColor:'#FFFFFF', normalText:'#0A0A0A', pressColor:'#FFFFFF', pressText:'#0A0A0A', barColor:'#FFFFFF' },
  black:    { normalColor:'#FFFFFF', normalText:'#0A0A0A', pressColor:'#FFFFFF', pressText:'#0A0A0A', barColor:'#FFFFFF' },
  fnf:      { normalColor:'#C24B99', normalText:'#FFFFFF', pressColor:'#00FFFF', pressText:'#04303A', barColor:'#12FA05' },
  fnfpixel: { normalColor:'#E276FF', normalText:'#FFFFFF', pressColor:'#3DCAFF', pressText:'#032B3A', barColor:'#71E300' }
};

/* ================= 布局数据 ================= */
const TABS = [{id:'color',name:'颜色'},{id:'bar',name:'长条'},{id:'stat',name:'统计'},{id:'theme',name:'主题'}];

const ROWS = {
  color: [
    {grp:'通用'},
    {id:'alpha', name:'透明度', kind:'num', min:0, max:1, step:0.01, fmt:v=>Math.round(v*100)+'%'},
    {grp:'常态'},
    {id:'normalColor', name:'常态颜色', kind:'col'},
    {id:'normalText',  name:'常态文本颜色', kind:'col'},
    {grp:'按下'},
    {id:'pressColor',  name:'按下颜色', kind:'col'},
    {id:'pressText',   name:'按下文本颜色', kind:'col'},
    {grp:'长条'},
    {id:'barColor',    name:'长条颜色', kind:'col'},
    {id:'barMode',     name:'取色来源', kind:'seg', opts:[['custom','用长条颜色'],['normal','跟随常态色']]}
  ],
  bar: [
    {grp:'显示'},
    {id:'barOn',    name:'显示长条', kind:'bool'},
    {id:'barAlpha', name:'透明度', kind:'num', min:0, max:1, step:0.01, fmt:v=>Math.round(v*100)+'%'},
    {grp:'形态'},
    {id:'barMax',   name:'长条最多显示高度', kind:'num', min:8, max:160, step:2, fmt:v=>v+'px'},
    {id:'barSpeed', name:'速度', kind:'num', min:0.1, max:5, step:0.1, fmt:v=>v.toFixed(1)+'x'},
    {id:'barStay',  name:'滞留时间', kind:'num', min:50, max:2000, step:50, fmt:v=>v+'ms'},
    {grp:'消隐'},
    {id:'barDis',   name:'消隐', kind:'bool'},
    {id:'barFade',  name:'消隐类型', kind:'seg', opts:[['fade','渐隐'],['sudden','直接消失']]}
  ],
  stat: [
    {grp:'统计区'},
    {id:'showStats',  name:'显示统计', kind:'bool'},
    {id:'statHeight', name:'统计区高度', kind:'num', min:16, max:120, step:2, fmt:v=>v+'px'},
    {id:'statWidth',  name:'统计区宽度', kind:'num', min:40, max:100, step:2, fmt:v=>v+'%'},
    {id:'statAlpha',  name:'统计区透明度', kind:'num', min:0, max:1, step:0.01, fmt:v=>Math.round(v*100)+'%'}
  ],
  theme: [
    {grp:'配色来源'},
    {id:'followSong', name:'跟随谱面 RGB 音符配色', kind:'bool'},
    {id:'theme', name:'主题', kind:'seg', opts:[['default','默认'],['black','黑'],['fnf','FNF标准'],['fnfpixel','FNF像素'],['custom','自定义']]},
    {grp:'迁移'},
    {id:'doExport', name:'导出为 JSON', kind:'act'},
    {id:'doImport', name:'从 JSON 导入', kind:'act'}
  ]
};
const PAL = ['#FFFFFF','#000000','#1B1B1B','#C24B99','#00FFFF','#12FA05','#F9393F','#FFD24A',
             '#3DCAFF','#E276FF','#71E300','#FF884E','#1490A0','#7BE08A','#A9B3C4','#5B6B8C'];
/* 统计块的额外字段：宽高/透明度放在每个目标上，便于独立 */
ids().forEach(id => { store[id].statHeight = 34; store[id].statWidth = 100; store[id].statAlpha = 0.8; });

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const cur = () => store[ui.selTarget];
const rgba = (hex,a) => { const n=parseInt(hex.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${Math.max(0,Math.min(1,a))})`; };
const isStat = () => ui.selTarget==='kps' || ui.selTarget==='total';

/* 键位真实画法：描边 0.8×α + 填充 0.3×α（不要给整元素加 opacity，那会连文字一起冲淡） */
function keyLook(el, cfg, scale){
  const s = scale || 1;
  el.style.background = rgba(cfg.normalColor, 0.30*cfg.alpha);
  el.style.border = '2px solid ' + rgba(cfg.normalColor, 0.80*cfg.alpha);
  el.style.color = cfg.normalText;
}
function barHex(cfg){ return cfg.barMode==='normal' ? cfg.normalColor : cfg.barColor; }
/* 渐隐：顶部淡出；直接消失：实心 */
function barBg(cfg){
  const c = barHex(cfg), a = cfg.barAlpha;
  if (cfg.barFade==='fade' && cfg.barDis)
    return `linear-gradient(180deg, ${rgba(c,0)} 0%, ${rgba(c,a*0.35)} 35%, ${rgba(c,a)} 100%)`;
  return rgba(c, a);
}
function markCustom(){ ui.theme = 'custom'; }

/* ================= 渲染 ================= */
function renderKeys(host, interactive, cfgOf, selId){
  host.innerHTML = '';
  for (let i=0;i<KEYS;i++){
    const el = document.createElement('div'), cfg = cfgOf(i);
    el.className = 'key' + (interactive?' pick':'') + (selId==='k'+i?' sel':'');
    keyLook(el, cfg);
    el.innerHTML = `<span class="arw"></span>${LETTER[i]}`;
    if (interactive) el.onclick = () => { ui.selTarget='k'+i; ui.selKey=i; syncList(); renderPreview(); };
    host.appendChild(el);
  }
}
function renderStats(host, interactive, cfgOf, selId){
  host.innerHTML = '';
  [['kps','KPS','128'],['total','total','5820']].forEach(([id,lab,num])=>{
    const cfg = cfgOf(id), el = document.createElement('div');
    el.className = 'stat' + (interactive?' pick':'') + (selId===id?' sel':'');
    el.style.width = cfg.statWidth + '%';
    el.style.height = cfg.statHeight + 'px';
    el.style.background = rgba(cfg.normalColor, 0.30*cfg.alpha);
    el.style.border = '2px solid ' + rgba(cfg.normalColor, 0.80*cfg.alpha);
    el.style.color = cfg.normalText;
    el.style.opacity = cfg.statAlpha;
    el.innerHTML = `<span>${lab}</span><span class="num">${num}</span>`;
    if (interactive) el.onclick = e => { e.stopPropagation(); ui.selTarget=id; ui.selKey=-1; syncList(); renderPreview(); };
    host.appendChild(el);
  });
}
function renderTri(){
  const cfg = cur(), host = $('#tri');
  const cap = labelOf(ui.selTarget);
  const normal = `background:${rgba(cfg.normalColor,0.30*cfg.alpha)};border:2px solid ${rgba(cfg.normalColor,0.80*cfg.alpha)};color:${cfg.normalText}`;
  const press  = `background:${rgba(cfg.pressColor,cfg.alpha)};border:2px solid ${rgba(cfg.pressColor,Math.min(1,cfg.alpha*1.25))};color:${cfg.pressText}`;
  const barOn  = cfg.barOn && cfg.barDis !== false;
  host.innerHTML = `
    <div class="cell"><div class="cap">常态</div><div class="demo" style="${normal}">${cap}</div></div>
    <div class="cell"><div class="cap">被按下</div><div class="demo" style="${press}">${cap}</div></div>
    <div class="cell"><div class="cap">长条${cfg.barOn?'':'（已关闭）'}</div>
      <div class="barwrap">${cfg.barOn
        ? `<div class="bar" style="height:${cfg.barMax}px;background:${barBg(cfg)}"></div>`
        : `<div style="font-size:11px;color:#7C8697">—</div>`}</div></div>`;
}
function renderPreview(){
  renderKeys($('#keysD'), false, ()=>DEF(), null);
  renderStats($('#statsD'), false, ()=>DEF(), null);
  renderKeys($('#keysC'), true, i=>store['k'+i], ui.selTarget.startsWith('k')?ui.selTarget:null);
  renderStats($('#statsC'), true, id=>store[id], isStat()?ui.selTarget:null);
  const show = ui.selTarget.startsWith('k') || isStat();
  $('#triBlock').style.display = show ? 'block':'none';
  if (show) renderTri();
  updateTools();
}
function renderTabs(){
  $('#tabs').innerHTML = TABS.map(t=>`<button class="tab ${ui.tab===t.id?'on':''}" data-tab="${t.id}">${t.name}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => {
    ui.tab = b.dataset.tab;
    /* 换分类后原来的选中行在新分类里不存在 → 默认落到该分类的第一个「颜色项」，
       这样取色工具立刻可用，而不是一片空白等着用户再点一次 */
    const first = ROWS[ui.tab].find(x => x.kind === 'col') || ROWS[ui.tab].find(x => !x.grp);
    ui.selRow = first ? first.id : '';
    syncTabHighlight();
    syncList();
    renderPreview();
  });
}
/* 切分类时同步高亮（不重建按钮，避免闪烁） */
function syncTabHighlight(){
  $('#tabs').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.tab === ui.tab));
}
/* 只重写列表（不重建预览） */
function syncList(){
  const cfg = cur(), rows = ROWS[ui.tab];
  let html = '';
  for (const r of rows){
    if (r.grp){ html += `<div class="grp">${r.grp}</div>`; continue; }
    /* 不生效的行：置灰 + 悬停说明 */
    let why = '';
    if (r.kind==='col'){
      if (isStat() && r.id!=='normalColor' && r.id!=='normalText')
        why = '统计块只支持「常态颜色 / 常态文本颜色」';
      else if (r.id==='barColor' && cfg.barMode==='normal')
        why = '取色来源当前是「跟随常态色」，此项不生效';
    }
    let ctl = '';
    if (r.kind==='bool')
      ctl = `<div class="switch ${cfg[r.id]?'on':''}" data-t="bool" data-id="${r.id}"><i></i></div>`;
    else if (r.kind==='num')
      ctl = `<input class="slider" type="range" min="${r.min}" max="${r.max}" step="${r.step}"
              value="${cfg[r.id]}" data-t="num" data-id="${r.id}">
             <span class="hv" style="width:56px;text-align:right">${r.fmt(cfg[r.id])}</span>`;
    else if (r.kind==='col')
      ctl = `<span class="hv">${cfg[r.id].toUpperCase()}</span><span class="sw" style="background:${cfg[r.id]}"></span>`;
    else if (r.kind==='seg')
      /* ★ 必须包一层 .seg：CSS 规则是 `.seg button{…}`，
         裸 button 会退回浏览器默认样式（也就是"按钮样式丢失"） */
      ctl = `<span class="seg">` + r.opts.map(([v,n])=>
        `<button class="${cfg[r.id]===v?'on':''}" data-t="seg" data-id="${r.id}" data-v="${v}">${n}</button>`).join('') + `</span>`;
    else if (r.kind==='act')
      ctl = `<span class="hv" style="color:var(--arrow)">[ 执行 ]</span>`;
    html += `<div class="row ${ui.selRow===r.id?'sel':''} ${why?'off':''}" data-kind="${r.kind}" data-id="${r.id}"
              title="${why}" ${why?'style="opacity:.36"':''}>
              <span class="nm">${r.name}</span><span class="ctl">${ctl}</span>
              <span class="rl" data-t="reset" data-id="${r.id}" title="恢复该项">↺</span></div>`;
  }
  $('#list').innerHTML = html;
  $('#list').querySelectorAll('[data-t="bool"]').forEach(el => el.onclick = () => {
    cfg[el.dataset.id] = !cfg[el.dataset.id]; markCustom(); syncList(); renderPreview(); });
  $('#list').querySelectorAll('[data-t="num"]').forEach(el => {
    el.oninput = () => {
      cfg[el.dataset.id] = parseFloat(el.value); markCustom();
      const spec = ROWS[ui.tab].find(x=>x.id===el.dataset.id);
      el.parentElement.querySelector('.hv').textContent = spec.fmt(cfg[el.dataset.id]);
      renderPreview();                      /* 拖动时只刷预览，不重建列表（否则滑块会掉焦点） */
    };
  });
  $('#list').querySelectorAll('[data-t="seg"]').forEach(el => el.onclick = () => {
    cfg[el.dataset.id] = el.dataset.v; markCustom();
    if (el.dataset.id === 'theme') applyTheme(el.dataset.v);
    syncList(); renderPreview();
  });
  $('#list').querySelectorAll('.row').forEach(el => el.onclick = e => {
    if (e.target.dataset.t) return;
    if (el.classList.contains('off')) return;
    ui.selRow = el.dataset.id; syncList(); renderPreview();
  });
  $('#list').querySelectorAll('[data-t="reset"]').forEach(el => el.onclick = e => {
    e.stopPropagation(); const d = DEF();
    if (el.dataset.id in d) cur()[el.dataset.id] = d[el.dataset.id];
    markCustom(); syncList(); renderPreview();
  });
}
function applyTheme(t){
  if (t === 'custom') return;
  const p = THEMES[t]; if (!p) return;
  ids().forEach(id => Object.assign(store[id], p));   /* 主题应用到全部目标 */
}
function isColorRow(){ const r = ROWS[ui.tab].find(x=>x.id===ui.selRow); return !!(r && r.kind==='col'); }
function updateTools(){
  const show = isColorRow();
  $('#tools').classList.toggle('show', show);
  if (!show) return;
  const v = cur()[ui.selRow];
  $('#curSw').style.background = v;
  if (document.activeElement !== $('#hexIn')) $('#hexIn').value = v.toUpperCase();
  $('#targetName').textContent = labelOf(ui.selTarget) + ' / ' + ROWS[ui.tab].find(x=>x.id===ui.selRow).name;
  const hsv = hexToHsv(v), R = 48, ang = (hsv.h - 90)*Math.PI/180;
  const d = $('#wheelDot');
  d.style.left = (56 + Math.cos(ang)*R*(hsv.s/100)) + 'px';
  d.style.top  = (56 + Math.sin(ang)*R*(hsv.s/100)) + 'px';
  d.style.background = v;
  $('#briDot').style.top = ((1-hsv.v/100)*106) + 'px';
}
function hsvToHex(h,s,v){ s/=100; v/=100;
  const c=v*s, x=c*(1-Math.abs(((h/60)%2)-1)), m=v-c; let r=0,g=0,b=0;
  if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}
  else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}
  const f=n=>Math.round((n+m)*255).toString(16).padStart(2,'0'); return '#'+f(r)+f(g)+f(b); }
function hexToHsv(hex){ const n=parseInt(hex.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn; let h=0;
  if(d){ if(mx===r)h=60*(((g-b)/d)%6); else if(mx===g)h=60*((b-r)/d+2); else h=60*((r-g)/d+4); }
  if(h<0)h+=360; return {h,s:mx?d/mx*100:0,v:mx*100}; }
function setColor(hex){ cur()[ui.selRow]=hex; markCustom(); syncList(); renderPreview(); }

/* ================= 交互 ================= */
$('#pal').innerHTML = PAL.map(c=>`<i style="background:${c}" data-c="${c}"></i>`).join('');
$('#pal').onclick = e => { if (e.target.dataset.c) setColor(e.target.dataset.c); };
$('#wheel').onclick = e => {
  const r = e.currentTarget.getBoundingClientRect();
  const x = e.clientX-r.left-56, y = e.clientY-r.top-56;
  let h = Math.atan2(y,x)*180/Math.PI + 90; if (h<0) h+=360;
  const s = Math.min(1, Math.hypot(x,y)/48)*100;
  setColor(hsvToHex(h, s, hexToHsv(cur()[ui.selRow]).v));
};
$('#bri').onclick = e => {
  const r = e.currentTarget.getBoundingClientRect();
  const v = (1-Math.min(1,Math.max(0,(e.clientY-r.top)/r.height)))*100;
  const c = hexToHsv(cur()[ui.selRow]);
  setColor(hsvToHex(c.h, c.s||100, v));
};
/* HEX 输入框 */
$('#hexIn').oninput = e => {
  let t = e.target.value.trim().toUpperCase(); if (!t.startsWith('#')) t = '#'+t;
  if (/^#[0-9A-F]{6}$/.test(t)) setColor(t);
};
$('#btnReset').onclick = () => {
  ids().forEach(id => store[id] = DEF());
  ui.theme='default'; ui.selTarget='k3'; ui.selKey=3; ui.tab='color';
  renderTabs(); syncList(); renderPreview();
};
$('#btnSave').onclick = e => {
  /* 真导出：把当前配置写成 JSON（后续 Haxe 版用同一份结构） */
  const payload = { version:1, theme:ui.theme, targets:store };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'keyboard-feedback.json'; a.click();
  e.target.textContent = '已导出 ✓'; setTimeout(()=>e.target.textContent='保存并退出', 1000);
};
function fit(){ $('#stage').style.transform = `scale(${Math.min(innerWidth/1280, innerHeight/720)})`; }
addEventListener('resize', fit);

renderTabs(); syncList(); renderPreview(); fit();
</script>
</body>
