let current='general';const list=document.querySelector('#catlist'),root=document.querySelector('#settings');
function makeControl(v){let [value,kind='text']=v.split('|');if(kind.startsWith('toggle'))return `<button class="toggle ${kind.endsWith(':on')?'on':''}" aria-label="切换设置"></button>`;if(kind.startsWith('select'))return `<select>${kind.slice(7).split(',').map(o=>`<option ${o===value?'selected':''}>${o}</option>`).join('')}</select>`;if(kind.startsWith('range')){let [min,max,start]=kind.slice(6).split(',');return `<label class="range"><input type="range" min="${min}" max="${max}" value="${start}"><output>${value}</output></label>`}return `<span>${value}　↗</span>`}
function render(key){current=key;const d=data[key];list.innerHTML=cats.map(([id,name,desc,count],i)=>`<div class="cat ${id===key?'selected':''}" data-cat="${id}"><div class="catinfo"><div class="catname">${name}</div><div class="catdesc">${desc}</div></div><div class="catcount">${count}</div></div>`).join('');document.querySelector('#title').textContent=d.title;document.querySelector('#subtitle').textContent=d.subtitle;document.querySelector('#tip').textContent=d.subtitle;document.querySelector('#panelnum').textContent=`${String(cats.findIndex(c=>c[0]===key)+1).padStart(2,'0')} / 09`;root.innerHTML=d.groups.map(g=>`<div class="group"><div class="grouphead">${g[0]} <small>${g[1]}</small></div><div class="rows">${g[2].map(row=>{let [name,desc,value,kind='text']=row.split('|');return `<article class="row"><div class="rowtext"><b>${name}</b><small>${desc}</small></div><div class="value">${makeControl(`${value}|${kind}`)}</div></article>`}).join('')}</div></div>`).join('');root.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>b.classList.toggle('on'));root.querySelectorAll('.range input').forEach(r=>r.oninput=()=>r.nextElementSibling.textContent=r.value+(r.min==='-100'?' ms':r.max==='125'||r.max==='100'?'%':'×'));root.querySelectorAll('select').forEach(s=>s.onchange=()=>toast('已更新：'+s.value));root.querySelectorAll('.row').forEach(r=>r.onclick=e=>{if(e.target.closest('button,select,input'))return;root.querySelectorAll('.row').forEach(x=>x.style.outline='');r.style.outline='1px solid #e8c3d5'});}
list.addEventListener('click',e=>{const c=e.target.closest('[data-cat]');if(c)render(c.dataset.cat)});
let timer;function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>el.classList.remove('show'),1700)}document.querySelector('#apply').onclick=()=>toast('设置已保存到本地');document.querySelector('#resetTop').onclick=()=>{render(current);toast('当前分类已恢复默认预览')};document.querySelector('.tools').addEventListener('click',e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(a==='search'){const term=prompt('搜索当前分类中的设置');if(term){const q=term.toLowerCase();let found=0;root.querySelectorAll('.row').forEach(r=>{const yes=r.innerText.toLowerCase().includes(q);r.style.display=yes?'':'none';if(yes)found++});toast(found?`找到 ${found} 项设置`:'没有匹配的设置')}}else if(a==='import')toast('导入方案：预览功能');else if(a==='export')toast('导出方案：预览功能');else if(a==='help')toast('使用 ↑↓ 切换分类，点击控件调整选项')});document.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){const i=cats.findIndex(c=>c[0]===current),n=(i+(e.key==='ArrowDown'?1:cats.length-1))%cats.length;render(cats[n][0])}if(e.key==='Escape')toast('返回 Freeplay')});render(current);
</script></body></html>
